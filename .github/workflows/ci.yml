name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type check, and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.13.5"
          python-version: "3.12.15"
          enable-cache: false

      - name: Check formatting, lint, and types
        run: make lint

      - name: Run unit tests
        run: make test-unit

  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      UV_NO_ENV_FILE: "1"
      PAYMENTS_ENVIRONMENT: test
      PAYMENTS_DATABASE_URL: postgresql+psycopg://payments:ci_only_password@127.0.0.1:5432/payments
      PAYMENTS_REDIS_URL: redis://127.0.0.1:6379/0
      PAYMENTS_TEST_DATABASE_URL: postgresql+psycopg://payments:ci_only_password@127.0.0.1:5432/payments_test
      PAYMENTS_TEST_REDIS_URL: redis://127.0.0.1:6379/0

    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: payments
          POSTGRES_PASSWORD: ci_only_password
          # The image creates this disposable database during initialization.
          POSTGRES_DB: payments_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U payments -d payments_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4.6-bookworm
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.13.5"
          python-version: "3.12.15"
          enable-cache: false

      # The existing fixture validates the test URL, then migrates that database
      # to head before tests. The schema suite also reverses and reapplies it.
      - name: Run migrations and integration tests
        run: make test-integration

  image-security:
    name: Docker build and Trivy scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build runtime image
        run: docker build --target runtime --tag payments-ledger-api:ci .

      - name: Save image for scanning
        run: docker save --output "$RUNNER_TEMP/payments-ledger-api.tar" payments-ledger-api:ci

      - name: Scan runtime image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: "v0.70.0"
          scan-type: image
          input: ${{ runner.temp }}/payments-ledger-api.tar
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          format: table
          timeout: 5m0s
          cache: false
