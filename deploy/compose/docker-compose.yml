services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:?Set a distinct database ending in _test}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-test-database.sh:/docker-entrypoint-initdb.d/10-test-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4.6-bookworm
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build:
      context: ../..
    environment:
      PAYMENTS_ENVIRONMENT: development
      PAYMENTS_DATABASE_URL: ${PAYMENTS_DATABASE_URL:?Set the container PostgreSQL URL}
      PAYMENTS_REDIS_URL: ${PAYMENTS_REDIS_URL:?Set the container Redis URL}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
  app:
    build:
      context: ../..
    environment:
      PAYMENTS_ENVIRONMENT: development
      PAYMENTS_LISTEN_HOST: 0.0.0.0
      PAYMENTS_DATABASE_URL: ${PAYMENTS_DATABASE_URL:?Set the container PostgreSQL URL}
      PAYMENTS_REDIS_URL: ${PAYMENTS_REDIS_URL:?Set the container Redis URL}
    ports:
      - "127.0.0.1:${PAYMENTS_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=10)"]
      interval: 10s
      timeout: 12s
      retries: 5
volumes:
  postgres_data:
